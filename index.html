<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Village"><meta name="theme-color" content="#f2f2f7"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><title>Udhav's Village</title><style>/* Udhav's Village — calm, Apple-style layer over the 3D world.
   One slim row on top (today + two round buttons), one slim dock at the bottom, and a single panel:
   a floating card on the left on iPad landscape and wide screens, a bottom sheet on phones and iPad portrait.
   No backdrop blur: blurring over a live WebGL canvas makes iPads drop frames. */
:root{
  --bg:#f2f2f7; --card:#ffffff; --card2:#f7f7fa; --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.07);
  --ink:#1c1c1e; --ink2:#6c6c70; --ink3:#a1a1a6; --line:rgba(60,60,67,.13);
  --blue:#007aff; --green:#34c759; --orange:#ff9500; --red:#ff3b30; --pink:#ff2d55; --purple:#af52de; --teal:#30b0c7; --indigo:#5856d6;
  --blue-soft:rgba(0,122,255,.12);
  --glass:rgba(255,255,255,.94); --shadow:0 12px 32px rgba(15,20,40,.14), 0 2px 6px rgba(15,20,40,.08);
  --ease:cubic-bezier(.32,.72,0,1); --pw:384px; --sheet:0px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1c1c1e; --card2:#232325; --fill:rgba(120,120,128,.26); --fill2:rgba(120,120,128,.14);
    --ink:#ffffff; --ink2:#98989f; --ink3:#5f5f65; --line:rgba(84,84,88,.55);
    --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --pink:#ff375f; --purple:#bf5af2; --teal:#40c8e0; --indigo:#5e5ce6;
    --blue-soft:rgba(10,132,255,.2); --glass:rgba(28,28,30,.95); --shadow:0 12px 32px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --card2:#232325; --fill:rgba(120,120,128,.26); --fill2:rgba(120,120,128,.14);
  --ink:#ffffff; --ink2:#98989f; --ink3:#5f5f65; --line:rgba(84,84,88,.55);
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --pink:#ff375f; --purple:#bf5af2; --teal:#40c8e0; --indigo:#5e5ce6;
  --blue-soft:rgba(10,132,255,.2); --glass:rgba(28,28,30,.95); --shadow:0 12px 32px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark;
}
@media (min-width:1180px){ :root{ --pw:404px } }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#cfe2ec;color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue-soft);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
#stage{position:fixed;inset:0}
#world{width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#world.drag{cursor:grabbing} #world.hot{cursor:pointer}
.glass{background:var(--glass);box-shadow:var(--shadow);border:.5px solid var(--line)}

/* splash */
#splash{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--bg);transition:opacity .6s var(--ease)}
#splash.out{opacity:0;pointer-events:none}
#splash .sp{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.appicon{width:76px;height:76px;border-radius:20px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#ff9f43,#ff6b3d 55%,#e84a5f);box-shadow:0 12px 30px rgba(255,107,61,.35)}
.appicon svg{width:40px;height:40px;stroke-width:2}
#splash b{font-size:22px;letter-spacing:-.02em;margin-top:6px} #splash p{margin:0;color:var(--ink2)}
.barl{width:140px;height:4px;border-radius:2px;background:var(--fill);overflow:hidden;margin-top:6px}
.barl i{display:block;height:100%;width:40%;border-radius:2px;background:var(--blue);animation:load 1.1s var(--ease) infinite}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(260%)}}

/* top row */
#hdr{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none;transition:opacity .35s var(--ease)}
#hdr>*{pointer-events:auto}
#hToday{display:flex;align-items:center;gap:11px;border-radius:24px;padding:7px 16px 7px 7px;text-align:left;min-width:0;transition:opacity .35s var(--ease),transform .5s var(--ease)}
#hToday:active{transform:scale(.97)}
#hToday small{display:block;font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
#hToday b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hToday>span{min-width:0}
.ring{width:38px;height:38px;transform:rotate(-90deg);flex:none}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .rt{stroke:var(--fill)} .ring .rv{stroke:var(--green);stroke-dasharray:113.1;stroke-dashoffset:113.1;transition:stroke-dashoffset .9s var(--ease)}
.hbtns{display:flex;gap:10px;flex:none}
.round{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;padding:0;transition:transform .3s var(--ease)}
.round:active{transform:scale(.92)}
.round[aria-pressed="true"],.round[aria-expanded="true"]{color:var(--blue)}
body.side-open #hToday{opacity:0;pointer-events:none;transform:translateX(-14px)}
body.walking #hdr,body.walking #dock,body.walking #pins{opacity:0;pointer-events:none}
body.walking #pins *{pointer-events:none}

/* bottom dock */
#dock{position:fixed;z-index:6;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);display:flex;gap:2px;padding:5px;border-radius:28px;
  transition:transform .5s var(--ease),opacity .3s var(--ease),left .5s var(--ease)}
#dock button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:64px;height:52px;padding:4px 10px;border:0;border-radius:22px;background:transparent;color:var(--ink2);transition:background .25s,color .25s,transform .25s var(--ease)}
#dock button:active{transform:scale(.93)}
#dock button[aria-pressed="true"]{background:var(--blue-soft);color:var(--blue)}
#dock .di svg{width:23px;height:23px}
#dock .dl{font-size:11px;font-weight:600;letter-spacing:.01em}
#dock em{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font:700 11px/18px -apple-system,system-ui,sans-serif;font-style:normal;text-align:center;box-shadow:0 0 0 2px var(--glass)}
#dock em.ok{background:var(--green)} #dock em.calm{background:var(--ink3)}
body.side-open #dock{left:calc(var(--pw) + 12px + (100vw - var(--pw) - 12px) / 2)}
body.sheet-open #dock{transform:translate(-50%,140%);opacity:0;pointer-events:none}

/* pins over buildings */
#pins{position:fixed;inset:0;pointer-events:none;z-index:3;transition:opacity .3s}
.pin{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;padding:4px 11px 4px 4px;border:.5px solid var(--line);border-radius:18px;background:var(--glass);
  box-shadow:0 6px 16px rgba(15,20,40,.16);font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;pointer-events:auto;will-change:transform;transition:opacity .25s;contain:layout style}
.pin .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--pc,#888);flex:none}
.pin .ic svg{width:14px;height:14px;stroke-width:2.2}
.pin .bd{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;margin-right:-5px}
.pin .bd.ok{background:var(--green)}
.pin.away{opacity:0;pointer-events:none}
.pin.sel{box-shadow:0 0 0 2px var(--pc),0 8px 20px rgba(15,20,40,.2)}

/* the panel */
#panel{position:fixed;z-index:8;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 18px 50px rgba(10,15,30,.24),0 2px 8px rgba(10,15,30,.1);overflow:hidden;
  transition:transform .55s var(--ease),opacity .3s;will-change:transform}
body.side #panel{left:calc(env(safe-area-inset-left,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:var(--pw);border-radius:24px}
body.side #panel.off{transform:translateX(calc(-100% - 30px))}
body.side .grab{display:none}
body:not(.side) #panel{left:0;right:0;margin:0 auto;max-width:700px;bottom:0;height:calc(100% - env(safe-area-inset-top,0px) - 22px);border-radius:24px 24px 0 0;transform:translateY(calc(100% - var(--sheet)))}
body:not(.side) #panel.off{transform:translateY(100%)}
body:not(.side) #panel.dragging{transition:none}
.grab{flex:none;height:22px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab i{width:38px;height:5px;border-radius:3px;background:var(--ink3);opacity:.7}
.phead{flex:none;display:flex;align-items:flex-start;gap:10px;padding:16px 16px 10px 20px;touch-action:none}
body:not(.side) .phead{padding-top:2px}
.phead .pt{flex:1;min-width:0}
.phead small{display:block;font-size:13px;font-weight:600;color:var(--ink2);min-height:17px}
.phead h2{margin:1px 0 0;font-size:28px;line-height:1.12;font-weight:700;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{flex:none;width:32px;height:32px;border-radius:50%;border:0;background:var(--fill);color:var(--ink2);display:grid;place-items:center;padding:0;margin-top:4px}
.ib svg{width:17px;height:17px;stroke-width:2.4}
.ib.back{background:transparent;color:var(--blue);width:auto;padding:0 6px 0 0;margin-left:-8px}
.ib.back svg{width:24px;height:24px}
.pbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 16px calc(env(safe-area-inset-bottom,0px) + 28px)}
.pbody>*{animation:rise .42s var(--ease) both}
.pbody>*:nth-child(2){animation-delay:.03s} .pbody>*:nth-child(3){animation-delay:.06s} .pbody>*:nth-child(4){animation-delay:.09s} .pbody>*:nth-child(n+5){animation-delay:.12s}
.pbody.static>*{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* building blocks */
.card{background:var(--card);border-radius:18px;padding:16px;margin:0 0 20px}
.gh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 6px 7px 16px;font-size:13px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em}
.gh a,.gh button{font-size:14px;font-weight:500;color:var(--blue);text-transform:none;letter-spacing:0;text-decoration:none;background:none;border:0;padding:0}
.grp{background:var(--card);border-radius:14px;overflow:hidden;margin:0 0 22px}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:52px;padding:9px 14px;background:var(--card);border:0;width:100%;text-align:left;transition:background .2s}
button.row:active,.row.tap:active{background:var(--fill2)}
.row+.row::before{content:"";position:absolute;top:0;left:54px;right:0;height:.5px;background:var(--line)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:16px;font-weight:500;line-height:1.28;letter-spacing:-.01em;overflow-wrap:anywhere}
.row .tx small{display:block;font-size:13px;color:var(--ink2);margin-top:1px;line-height:1.3}
.row .acc{flex:none;color:var(--ink3);display:flex;align-items:center;gap:6px;font-size:15px}
.row .acc svg{width:18px;height:18px}
.chk{position:relative;flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink3);background:transparent;padding:0;display:grid;place-items:center;color:#fff;transition:background .25s var(--ease),border-color .25s,transform .25s var(--ease)}
.chk::after{content:"";position:absolute;inset:-9px}
.chk svg{width:16px;height:16px;stroke-width:3;opacity:0;transform:scale(.3);transition:opacity .2s,transform .35s var(--ease)}
.chk:active{transform:scale(.88)}
.row.done .chk{background:var(--c,var(--blue));border-color:var(--c,var(--blue))}
.row.done .chk svg{opacity:1;transform:none}
.row.done .tx b{color:var(--ink3)}
.row .tx .due{font-size:13px;font-weight:600;color:var(--ink2)} .due.over{color:var(--red)!important} .due.today{color:var(--orange)!important}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c,var(--blue))}
.ptag{display:inline-flex;align-items:center;gap:5px}
.ptag i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--ink3));display:inline-block}
.del{flex:none;border:0;background:transparent;color:var(--ink3);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;padding:0;opacity:.75}
.del svg{width:16px;height:16px}
.del.arm{background:var(--red);color:#fff;opacity:1}
.empty{padding:16px;color:var(--ink2);font-size:15px;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:13px;padding:13px 18px;font-size:16px;font-weight:600;background:var(--blue);color:#fff;transition:transform .2s var(--ease),opacity .2s}
.btn:active{transform:scale(.96)} .btn:disabled{opacity:.4}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:11px}
.btn.tint{background:var(--blue-soft);color:var(--blue)}
.btn.gray{background:var(--fill);color:var(--ink)}
.btn.wide{width:100%}
.btn svg{width:18px;height:18px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 22px}
.btns .btn{flex:1}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 6px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:1px 0;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:0;border-radius:17px;padding:8px 13px;background:var(--fill);font-size:14px;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s}
.chips button[aria-pressed="true"]{background:var(--blue);color:#fff}
.chips button i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink3))}
.chips button[aria-pressed="true"] i{background:#fff}

/* hero cards */
.hero{display:flex;align-items:center;gap:16px}
.hero .ring{width:84px;height:84px}
.hero .ring circle{stroke-width:8}
.hero .ring .rv{stroke-dasharray:113.1}
.hero .big{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.hero .sub{color:var(--ink2);font-size:14px;margin-top:3px}
.hero .flame{display:inline-flex;align-items:center;gap:4px;margin-top:8px;padding:4px 10px 4px 8px;border-radius:12px;background:rgba(255,149,0,.13);color:var(--orange);font-size:13px;font-weight:600}
.hero .flame svg{width:15px;height:15px}
.next{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:14px;border-top:.5px solid var(--line)}
.next .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;background:var(--c,var(--blue));flex:none}
.next .ic svg{width:20px;height:20px}
.next .tx{flex:1;min-width:0} .next .tx small{display:block;font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em}
.next .tx b{display:block;font-size:16px;font-weight:600;line-height:1.25}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;margin:0 0 10px;background:var(--card)}
.banner .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;background:var(--c,var(--orange));flex:none}
.banner .ic svg{width:18px;height:18px}
.banner b{display:block;font-size:15px;font-weight:600;line-height:1.25} .banner small{display:block;color:var(--ink2);font-size:13px}
.banners{margin:0 0 22px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 22px}
.tile{border:0;border-radius:16px;background:var(--card);padding:12px 10px 11px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;min-height:96px;transition:transform .2s var(--ease)}
.tile:active{transform:scale(.96)}
.tile .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--c)}
.tile .ic svg{width:18px;height:18px}
.tile b{font-size:14px;font-weight:600;line-height:1.2} .tile small{font-size:12px;color:var(--ink2);margin-top:-6px}
.count{font-size:42px;font-weight:700;letter-spacing:-.04em;line-height:1}
.count small{font-size:17px;font-weight:600;letter-spacing:0;color:var(--ink2);margin-left:4px;white-space:nowrap}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--card2);border-radius:12px;padding:10px 12px}
.kv small{display:block;font-size:12px;color:var(--ink2);font-weight:600}
.kv b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:8px;border-radius:4px;background:var(--fill);overflow:hidden;margin-top:12px;display:flex;gap:3px}
.prog i{flex:1;border-radius:4px;background:var(--fill)}
.prog i.on{background:var(--green)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:12px;font-size:13px;font-weight:600;background:var(--fill);color:var(--ink2)}
.pill.live{background:rgba(52,199,89,.15);color:var(--green)}
.pill.hot{background:rgba(255,59,48,.13);color:var(--red)} .pill.warm{background:rgba(255,149,0,.15);color:var(--orange)}
.spark{display:block;width:100%;height:56px;margin-top:12px}
.note{font-size:14px;color:var(--ink2);margin:8px 0 0}
.emp{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;flex:none}
.av.sm{width:34px;height:34px;font-size:13px}
.emp .tx{flex:1;min-width:0} .emp b{display:block;font-size:16px} .emp small{display:block;color:var(--ink2);font-size:13px}

/* add a task */
.add{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 14px}
.add .plus{flex:none;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;border:0;padding:0}
.add .plus svg{width:16px;height:16px;stroke-width:2.6}
.add input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);outline:none;padding:8px 0}
.add input::placeholder{color:var(--ink3)}
.addx{padding:0 14px 12px;display:flex;flex-direction:column;gap:10px}
.addx .line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.addx label{font-size:13px;color:var(--ink2);font-weight:600}
input[type="datetime-local"],input[type="number"].f,textarea.f,input[type="text"].f{font:inherit;font-size:16px;color:var(--ink);background:var(--fill2);border:0;border-radius:10px;padding:9px 11px;outline:none}
textarea.f{width:100%;min-height:74px;resize:vertical}

/* gym */
.dnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 14px}
.dnav b{font-size:17px}
.exrow{display:grid;grid-template-columns:1fr 54px 54px 66px 30px;gap:6px;align-items:center;padding:8px 10px 8px 14px}
.exrow+.exrow{border-top:.5px solid var(--line)}

.exrow input:first-child{background:transparent;padding-left:0;font-weight:500}
.exh{display:grid;grid-template-columns:1fr 54px 54px 66px 30px;gap:6px;padding:8px 10px 0 14px;font-size:12px;color:var(--ink2);font-weight:600}
.list2{list-style:none;margin:0;padding:0}
.list2 li{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;font-size:15px}
.list2 li+li{border-top:.5px solid var(--line)}
.list2 em{font-style:normal;color:var(--ink2);font-size:14px;text-align:right}
.list2 button{border:0;background:none;color:var(--blue);padding:0;font-size:15px}

/* chat */
.team{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 18px;padding:2px 16px}
.team::-webkit-scrollbar{display:none}
.team button{flex:none;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;width:58px;font-size:12px;font-weight:600;color:var(--ink2)}
.team button .av{box-shadow:0 0 0 0 var(--blue);transition:box-shadow .25s}
.team button[aria-pressed="true"] .av{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--blue)}
.team button[aria-pressed="true"]{color:var(--ink)}
.log{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
.msg{max-width:84%;padding:9px 13px;border-radius:19px;font-size:16px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.msg.ai{align-self:flex-start;background:var(--card);border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.msg.sys{align-self:center;background:none;color:var(--ink2);font-size:13px;padding:4px}
.cform{position:sticky;bottom:0;display:flex;gap:8px;align-items:flex-end;padding:8px 0 4px;background:var(--bg)}
.cform textarea{flex:1;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:.5px solid var(--line);border-radius:20px;padding:9px 14px;resize:none;outline:none;max-height:120px;min-height:40px}
.cform .btn{border-radius:20px;padding:9px 16px}

/* menu popover */
.pop{position:fixed;z-index:12;border-radius:18px;padding:8px;max-height:calc(100% - 100px);overflow:auto;-webkit-overflow-scrolling:touch;transform-origin:top right;animation:pop .32s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(-6px)}to{opacity:1;transform:none}}
#menu{top:calc(env(safe-area-inset-top,0px) + 70px);right:calc(env(safe-area-inset-right,0px) + 12px);width:min(320px,calc(100vw - 24px))}
.pop h5{margin:10px 10px 6px;font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.pop .seg{margin:0 6px 6px}
.opt{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;border-radius:11px;padding:9px 10px;text-align:left;font-size:15px;font-weight:500;color:var(--ink)}
.opt:active{background:var(--fill2)}
.opt .sw{width:28px;height:28px;border-radius:8px;flex:none;border:.5px solid var(--line)}
.opt .ck{margin-left:auto;color:var(--blue);opacity:0} .opt[aria-checked="true"] .ck{opacity:1}

.pop p.sm{margin:6px 10px 8px;font-size:12.5px;color:var(--ink2);line-height:1.4}

#wGoBtn{display:inline-flex;align-items:center;gap:7px;border:.5px solid var(--line)}
#wGoBtn svg{width:19px;height:19px;color:var(--blue)}

#wStatus .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--c);flex:none}
#wStatus .ic svg{width:14px;height:14px}
body.side-open #wDone{transform:translateX(calc(var(--pw) + 12px))}
#wDone{transition:transform .5s var(--ease)}
#wGo{top:calc(env(safe-area-inset-top,0px) + 64px);right:calc(env(safe-area-inset-right,0px) + 12px);width:min(300px,calc(100vw - 24px))}

#joy.on{opacity:1}
#joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 4px 12px rgba(0,0,0,.22)}
#joyHint{position:fixed;left:calc(env(safe-area-inset-left,0px) + 40px);bottom:calc(env(safe-area-inset-bottom,0px) + 40px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;transition:opacity .5s}
#joyHint i{width:104px;height:104px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.85);background:rgba(255,255,255,.12)}
#joyHint span{font-size:13px;font-weight:600;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.45)}
#joyHint.fade{opacity:0}
body.side-open #joyHint{left:calc(var(--pw) + 52px)}
#wKeys{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);margin:0;font-size:13px;font-weight:600;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5);white-space:nowrap;transition:opacity .5s;pointer-events:none}
#wNear{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border-radius:24px;width:max-content;max-width:min(560px,calc(100vw - 24px));animation:rise .4s var(--ease)}

#wNear .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--c);flex:none}

#wNear .tx{min-width:0} #wNear b{display:block;font-size:16px} #wNear small{display:block;color:var(--ink2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wNear .btn{padding:10px 16px;border-radius:16px}
#bubble{position:fixed;z-index:4;left:0;top:0;max-width:240px;padding:9px 13px;border-radius:16px;background:var(--glass);box-shadow:var(--shadow);font-size:13px;line-height:1.3;pointer-events:none;will-change:transform}
#bubble b{display:block;font-size:13px} #bubble span{color:var(--ink2)}
#bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--glass)}

#toast{position:fixed;z-index:20;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-140%);padding:11px 18px;border-radius:22px;background:var(--glass);box-shadow:var(--shadow);font-size:14px;font-weight:600;max-width:calc(100vw - 32px);text-align:center;transition:transform .5s var(--ease);pointer-events:none}
#toast.show{transform:translate(-50%,0)}

/* phones */
@media (max-width:599px){
  #hToday{padding:6px 14px 6px 6px;border-radius:22px}

  .phead h2{font-size:26px}
  .exrow,.exh{grid-template-columns:1fr 46px 46px 58px 28px;gap:5px}
  #wStatus{display:none!important}
  .pill.glass{height:42px;padding:0 14px}
}
